name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android toolchain
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Audit source tree
        shell: pwsh
        run: ./scripts/audit-public-source.ps1
      - name: Unit tests
        shell: pwsh
        run: ./gradlew.bat :core:test :provider-http:test :app:testPublicDebugUnitTest
      - name: Android lint
        shell: pwsh
        run: ./gradlew.bat :app:lintPublicDebug
