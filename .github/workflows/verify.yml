name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android toolchain
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Audit source tree
        shell: pwsh
        run: ./scripts/audit-public-source.ps1
      - name: Unit tests
        shell: pwsh
        run: ./gradlew.bat :core:test :provider-http:test :app:testPublicDebugUnitTest
      - name: Android lint
        shell: pwsh
        run: ./gradlew.bat :app:lintPublicDebug
